<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skywatch — Weather Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated atmospheric backdrop, recolors based on current conditions -->
  <div class="sky-backdrop" id="skyBackdrop" data-theme="clear-day" aria-hidden="true"></div>

  <div class="app">

    <header class="app-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
          <circle cx="20" cy="20" r="6" fill="currentColor"/>
          <line x1="20" y1="2" x2="20" y2="8" stroke="currentColor" stroke-width="1.4"/>
          <line x1="20" y1="32" x2="20" y2="38" stroke="currentColor" stroke-width="1.4"/>
          <line x1="2" y1="20" x2="8" y2="20" stroke="currentColor" stroke-width="1.4"/>
          <line x1="32" y1="20" x2="38" y2="20" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">Skywatch</span>
          <span class="brand-tag">Station Forecast</span>
        </div>
      </div>

      <form class="search-form" id="searchForm" autocomplete="off">
        <input
          type="text"
          id="cityInput"
          class="search-input"
          placeholder="Search a city — e.g. Ghaziabad, Tokyo, Nairobi"
          aria-label="Search city"
        />
        <button type="submit" class="icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="locateBtn" aria-label="Use my current location" title="Use my location">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3M12 19v3M22 12h-3M5 12H2"/>
          </svg>
        </button>
      </form>

      <div class="unit-toggle" id="unitToggle" role="group" aria-label="Temperature unit">
        <button class="unit-btn active" data-unit="metric">°C</button>
        <button class="unit-btn" data-unit="imperial">°F</button>
      </div>
    </header>

    <main id="mainContent" class="main-content">
      <!-- Populated dynamically by script.js: setup / loading / error / weather states -->
    </main>

    <footer class="app-footer">
      <p>Live data from OpenWeatherMap · Built as a final-year academic project</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
